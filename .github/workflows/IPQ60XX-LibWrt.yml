name: IPQ60XX-NN6000

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/hosesan/nn6000_roc.git
  REPO_BRANCH: master
  CONFIG_FILE: configs/IPQ60XX.config
  GENERAL_CONFIG_FILE: configs/General.config
  DIY_SCRIPT: scripts/Roc-script.sh
  TZ: Asia/Shanghai

jobs:
  Build:
    runs-on: ubuntu-22.04
    steps:
    - name: 初始化环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt update -y
        sudo apt install -y $(curl -fsSL is.gd/depends_ubuntu_2204)
        sudo timedatectl set-timezone "$TZ"

    - name: 检出仓库文件
      uses: actions/checkout@main

    - name: 检查关键文件是否存在
      run: |
        echo "当前工作目录: $(pwd)"
        echo "CONFIG_FILE: $CONFIG_FILE"
        echo "GENERAL_CONFIG_FILE: $GENERAL_CONFIG_FILE"
        echo "DIY_SCRIPT: $DIY_SCRIPT"
        echo "===== 检查文件 ====="
        if [ ! -f "$CONFIG_FILE" ]; then
          echo "❌ 错误：找不到配置文件 $CONFIG_FILE"
          exit 1
        fi
        if [ ! -f "$DIY_SCRIPT" ]; then
          echo "❌ 错误：找不到脚本文件 $DIY_SCRIPT"
          exit 1
        fi
        echo "✅ 所有关键文件检查通过"

    - name: 克隆 OpenWrt 源码
      run: |
        sudo mkdir -p /mnt/openwrt
        sudo chown -R $(id -u):$(id -g) /mnt/openwrt
        git clone --depth 1 -b $REPO_BRANCH $REPO_URL /mnt/openwrt
        cd /mnt/openwrt
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV

    - name: 加载配置文件
      run: |
        cat $CONFIG_FILE $GENERAL_CONFIG_FILE > $OPENWRT_PATH/.config
        cd $OPENWRT_PATH
        make defconfig

    - name: 运行自定义脚本
      run: |
        chmod +x $DIY_SCRIPT
        $GITHUB_WORKSPACE/$DIY_SCRIPT

    - name: 下载依赖包
      run: |
        cd $OPENWRT_PATH
        make download -j$(nproc)

    - name: 编译固件
      run: |
        cd $OPENWRT_PATH
        make -j$(nproc) || make -j1 V=s

    - name: 上传固件
      uses: actions/upload-artifact@main
      with:
        name: openwrt-firmware
        path: ${{ env.OPENWRT_PATH }}/bin/targets/qualcommax/ipq60xx/
